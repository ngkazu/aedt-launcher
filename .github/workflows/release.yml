name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify tag matches csproj Version
        shell: pwsh
        run: |
          $xml = [xml](Get-Content aedt-launcher/aedt-launcher.csproj -Raw)
          $version = $xml.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG does not match csproj Version $version" }

      - name: Publish win-x64 single file
        shell: pwsh
        run: >
          dotnet publish aedt-launcher/aedt-launcher.csproj -c Release -r win-x64
          --self-contained false -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:Platform=x64 -o publish

      - name: Package zip
        shell: pwsh
        run: |
          $stage = "stage/aedt-launcher-$env:TAG"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item publish/aedt-launcher.exe, publish/aedt-launcher.dll.config, LICENSE, README.md $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "aedt-launcher-$env:TAG.zip"

      - name: Create or update release
        shell: pwsh
        run: |
          $zip = "aedt-launcher-$env:TAG.zip"
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG $zip --title $env:TAG --generate-notes
          } else {
            gh release upload $env:TAG $zip --clobber
          }
