name: Feature request
description: Propose a feature or enhancement (write the body in Japanese)
labels: ["enhancement"]
body:
  - type: input
    id: title_ja
    attributes:
      label: Japanese title
      description: Enter the Japanese title of this issue.
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: Background
      description: Explain why this is needed.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the proposed change.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact and notes
      description: Describe any effect on existing behavior or other features.
  - type: input
    id: memo_item
    attributes:
      label: Memo item number
      description: If this issue came from memo/improvement-items.md, enter the item number.
