name: Bug report
description: Report a bug (write the body in Japanese)
labels: ["bug"]
body:
  - type: input
    id: title_ja
    attributes:
      label: Japanese title
      description: Enter the Japanese title of this issue.
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: List the steps to reproduce the bug.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: file_type
    attributes:
      label: Target file type
      options:
        - ICEPAK (.tzr / .tgz)
        - AEDT (.aedt / .aedtz)
        - SIwave (.siw / .siwz)
        - Folder
        - Unknown / Other
    validations:
      required: true
  - type: input
    id: ansys_version
    attributes:
      label: AEDT / ICEPAK version
      placeholder: "e.g. 2019 R3"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "e.g. Windows 11 (x64)"
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: aedt-launcher version
      placeholder: "e.g. v0.1.1"
    validations:
      required: true
  - type: input
    id: memo_item
    attributes:
      label: Memo item number
      description: If this issue came from memo/improvement-items.md, enter the item number.
